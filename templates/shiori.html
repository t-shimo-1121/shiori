<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{apptitle}}">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2E6A86">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F1D19">
<script>/* 旅行当日は表紙を小さく（描画前に判定） */
(function(){var d=new Date(),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if({{days_json}}.indexOf(k)>=0)document.documentElement.classList.add("trip");})();</script>
<title>{{doctitle}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   ① テーマ設定 ── 表紙が決まったら、基本ここだけ触れば色が変わります
      ・数値は「色相（0〜360）」。彩度・明度は自動で追従します。
      ・各しおりの色相は trip.yaml の hues・days[].hue から自動で入ります
   ══════════════════════════════════════════════════════════════ */
:root{
{{hue_vars}}
  --fs-base: 20px;  /* ② 全体の文字サイズ（大きくしたい時はここ／小画面は下部で自動調整） */
  --font-display:'Zen Maru Gothic', system-ui, sans-serif;
  --font-body:'Noto Sans JP', system-ui, sans-serif;

  /* ─ 以下は自動で決まる派生色（通常は触らなくてOK） ─ */
  --paper:      hsl(var(--h-base), 30%, 94%);
  --paper-2:    hsl(var(--h-base), 34%, 90%);
  --panel:      hsl(var(--h-base), 46%, 99%);
  --ink:        hsl(var(--h-base), 20%, 16%);
  --ink-2:      hsl(var(--h-base), 12%, 38%);
  --ink-3:      hsl(var(--h-base), 10%, 55%);
  --line:       hsl(var(--h-base), 22%, 84%);
  --line-soft:  hsl(var(--h-base), 22%, 90%);
  --brand:      hsl(var(--h-brand), 45%, 34%);
  --brand-bg:   hsl(var(--h-brand), 45%, 93%);
  --alert:      hsl(14, 62%, 44%);   /* 未予約・要注意の朱 */

  --radius: 14px;
  --col-time: 2.75rem;  /* 時刻カラムの幅（"10:30" がぴったり入る幅） */
  --col-ico:  1.3rem;   /* アイコンカラムの幅 */
  --col-gap:  .32rem;
  --row-pad:  .5rem;    /* タイムライン左右の余白 */
  --lh-main:  29px;     /* 上段の行高（px固定で行ズレを防ぐ） */
  --lh-sub:   25px;     /* 下段の行高 */
}

*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:var(--fs-base);-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  line-height:1.7;
  background-color:var(--paper);
  background-image:radial-gradient(hsla(var(--h-base),25%,45%,.10) 1.1px, transparent 1.1px);
  background-size:22px 22px;
  padding:0 0 3rem;
  -webkit-font-smoothing:antialiased;
}
body::before{ /* iPhoneのノッチ／Dynamic Island下の帯 */
  content:"";position:fixed;top:0;left:0;right:0;z-index:50;
  height:env(safe-area-inset-top);background:var(--paper);
}
.wrap{max-width:680px;margin:0 auto;padding:.65rem .4rem 0;}
.ic{width:1em;height:1em;display:inline-block;fill:currentColor;stroke:none;
    fill-rule:evenodd;clip-rule:evenodd;vertical-align:-.08em;}

/* ───────── 表紙 ───────── */
.cover{margin:.15rem 0 .8rem;filter:drop-shadow(0 8px 18px hsla(var(--h-base),30%,25%,.18));}
.cover-frame{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px;}
.cover-frame img{width:100%;display:block;border-radius:8px;}
/* 画像を入れるまでの仮置き。imgに差し替えるとそのまま同じ枠に収まります */
.cover-ph{
  aspect-ratio:4/3;border-radius:8px;
  border:2px dashed var(--line);
  background:linear-gradient(160deg, var(--brand-bg), var(--paper-2));
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:.8rem;font-weight:500;letter-spacing:.04em;text-align:center;
}
.cover-cap{padding:.65rem .2rem .2rem;text-align:center;}
.cover-cap h1{
  font-family:var(--font-display);font-weight:900;font-size:1.65rem;
  line-height:1.25;letter-spacing:.02em;color:var(--ink);
}
.cover-cap .date{
  margin-top:.15rem;font-size:.86rem;font-weight:700;color:var(--brand);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.cover-cap .count{margin-top:.1rem;font-size:.76rem;color:var(--ink-3);letter-spacing:.04em;}
.cover-cap .count b{font-family:var(--font-display);font-weight:900;font-size:1.5rem;color:var(--brand);
  margin:0 .15rem;vertical-align:-.12em;font-variant-numeric:tabular-nums;}
/* 旅行当日：表紙を細い帯に */
.trip .cover{display:flex;align-items:center;gap:.7rem;margin:.1rem 0 .3rem;filter:none;}
.trip .cover-frame{flex:none;width:4.2rem;padding:3px;border-radius:12px;}
.trip .cover-frame img{aspect-ratio:1;object-fit:cover;border-radius:9px;}
.trip .cover-cap{padding:0;text-align:left;}
.trip .cover-cap h1{font-size:1.1rem;}
.trip .cover-cap .date{font-size:.72rem;margin-top:0;}
.trip .cover-cap .count{font-size:.72rem;margin-top:0;}
.trip .cover-cap .count b{font-size:1rem;vertical-align:0;}

/* ───────── タブ ───────── */
.tabs{
  position:sticky;top:env(safe-area-inset-top);z-index:30;
  display:flex;gap:.25rem;
  padding:.55rem .4rem .6rem;margin:0 -.4rem .75rem;
  background:linear-gradient(var(--paper) 80%, hsla(var(--h-base),30%,94%,0));
  overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;scroll-padding-inline:.4rem;
}
.tabs::-webkit-scrollbar{display:none;}
/* 端にまだタブがある時だけ、その端をうっすら消して「続きがある」と分かるように */
.tabs.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent);}
.tabs.fl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 2rem);mask-image:linear-gradient(90deg,transparent,#000 2rem);}
.tabs.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 2rem,#000 calc(100% - 2rem),transparent);mask-image:linear-gradient(90deg,transparent,#000 2rem,#000 calc(100% - 2rem),transparent);}
.tab-btn{
  flex:1 0 auto;min-width:4.2rem;
  font-family:var(--font-body);font-weight:700;font-size:.72rem;white-space:nowrap;
  padding:.6rem .45rem;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);cursor:pointer;
  text-align:center;line-height:1.15;
  transition:transform .12s, background .15s, color .15s, border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn.t0{flex-grow:1.2;}
.tab-btn small{display:block;font-size:.62rem;font-weight:500;opacity:.75;letter-spacing:.02em;margin-top:.1rem;white-space:nowrap;}
.tab-btn:active{transform:scale(.96);}
.tab-btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.tab-btn.active{color:#fff;border-color:transparent;box-shadow:0 4px 12px hsla(var(--h-base),30%,25%,.20);}
.tab-btn.active.t0{background:hsl(var(--h-pack),52%,36%);}
{{tab_rules}}.tab-panel{display:none;}
.tab-panel.is-active{display:block;animation:fade .26s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ───────── 凡例 ───────── */
.legend{
  display:flex;align-items:center;gap:.4rem;
  font-size:.72rem;color:var(--ink-3);letter-spacing:.02em;
  margin:-.35rem .15rem 1rem;
}
.legend .ic{font-size:.9rem;flex:none;}

/* ───────── カード共通 ───────── */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:1rem;box-shadow:0 2px 0 var(--line);
}
.card-head{
  padding:.8rem .75rem;background:var(--c-bg);border-bottom:1px dashed var(--line);
  display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
}
.tag{
  display:inline-flex;align-items:center;gap:.35rem;flex:none;
  background:var(--c);color:#fff;font-weight:700;font-size:.76rem;
  padding:.28rem .7rem;border-radius:999px;letter-spacing:.02em;
}
.tag .ic{font-size:.95rem;}
.tag.only{padding:0;width:2rem;height:2rem;justify-content:center;}
.tag.only .ic{font-size:1.1rem;}
.card-title{font-family:var(--font-display);font-weight:700;font-size:1.02rem;line-height:1.3;}

{{day_rules}}.pack{--c:hsl(var(--h-pack),52%,36%);--c-bg:hsl(var(--h-pack),50%,93%);}

/* ───────── 山データ（登山日のカード上部） ───────── */
.mt{padding:.75rem .75rem .8rem;border-bottom:1px dashed var(--line);}
.mt-h{font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em;margin-bottom:.35rem;}
.ftable{width:100%;border-collapse:collapse;margin:.5rem 0 .15rem;}
.ftable th{
  font-family:var(--font-body);font-weight:700;font-size:.68rem;color:var(--ink-3);
  letter-spacing:.03em;text-align:left;padding:.3rem .3rem;border-bottom:2px solid var(--line);
}
.ftable th:last-child, .ftable td:last-child{text-align:right;}
.ftable td{
  padding:.5rem .3rem;border-bottom:1px solid var(--line-soft);font-size:.86rem;
  vertical-align:top;
}
.ftable td small{display:block;font-size:.72rem;color:var(--ink-3);font-weight:400;line-height:1.45;margin-top:.15rem;}
.ftable td:first-child{color:var(--ink-3);font-size:.74rem;white-space:nowrap;padding-top:.6rem;}
.ftable td:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--ink);}
.ftable tfoot td{
  border-bottom:none;border-top:2px solid var(--line);font-weight:700;color:var(--brand);
  padding-top:.5rem;
}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem;margin-top:.6rem;}
.stats.stats-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.stats.stats-5{grid-template-columns:repeat(5,minmax(0,1fr));gap:.22rem;}
.stats .s{background:var(--c-bg);border-radius:10px;padding:.5rem .15rem;text-align:center;min-width:0;}
.stats .n{display:flex;align-items:baseline;justify-content:center;gap:.06rem;white-space:nowrap;
  font-family:var(--font-display);font-weight:700;font-size:.92rem;line-height:1.25;font-variant-numeric:tabular-nums;}
.stats .n .u{font-size:.6rem;font-weight:500;}
.stats.stats-4 .n{font-size:.86rem;}
.stats.stats-5 .n{font-size:.78rem;}
.stats.stats-5 .n .u{font-size:.54rem;}
.stats .l{font-size:.62rem;color:var(--ink-2);line-height:1.3;margin-top:.1rem;}

/* ───────── タイムライン（2段＋テーブル整列） ───────── */
.trail{position:relative;}
.trail::before{ /* 時系列の背骨。アイコンの背景で行内は隠れ、行間だけに見える */
  content:"";position:absolute;top:6px;bottom:6px;
  left:calc(var(--row-pad) + var(--col-time) + var(--col-gap) + var(--col-ico)/2 - 1px);
  width:2px;background:var(--line-soft);
}
.tl{
  position:relative;
  display:grid;
  grid-template-columns:var(--col-time) var(--col-ico) 1fr;
  column-gap:var(--col-gap);row-gap:1px;
  padding:.5rem var(--row-pad);
  border-bottom:1px dashed var(--line-soft);
}
.tl:last-child{border-bottom:none;}
.t-start{
  grid-column:1;grid-row:1;text-align:right;white-space:nowrap;
  font-weight:700;font-size:1rem;line-height:var(--lh-main);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.t-dur{
  grid-column:1;grid-row:2;text-align:right;white-space:nowrap;
  font-size:.76rem;line-height:var(--lh-sub);color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.t-ico{
  grid-column:2;grid-row:1;
  display:flex;align-items:center;justify-content:center;
  height:var(--lh-main);color:var(--c);background:var(--panel);
}
.t-ico .ic{width:1.2rem;height:1.2rem;}
.t-sum{
  grid-column:3;grid-row:1;
  font-size:1rem;font-weight:500;line-height:var(--lh-main);
}
.t-det{
  grid-column:3;grid-row:2;
  font-size:.82rem;line-height:var(--lh-sub);color:var(--ink-2);
}
.hl{font-weight:700;color:var(--c);background:var(--c-bg);padding:.05rem .3rem;border-radius:5px;}
.warn{font-weight:700;color:var(--alert);}
a.map{color:inherit;text-decoration:underline dotted var(--c);text-decoration-thickness:2px;
  text-underline-offset:4px;-webkit-tap-highlight-color:transparent;}
a.map:active{background:var(--c-bg);}
.tl.stay{background:hsla(var(--h-base),30%,50%,.05);}
.tl.hike{background:var(--c-tint);}
.tl.hike::before{ /* 登山区間は背骨を日の色で太く */
  content:"";position:absolute;top:0;bottom:0;
  left:calc(var(--row-pad) + var(--col-time) + var(--col-gap) + var(--col-ico)/2 - 2px);
  width:4px;background:var(--c);opacity:.55;
}
.tl.hike .t-ico{background:var(--c-tint);position:relative;z-index:1;}
.tl.now{background:var(--c-bg);box-shadow:inset 4px 0 0 var(--c);}
.tl.past,.sun.past{opacity:.4;}
.sun{
  position:relative;display:grid;grid-template-columns:var(--col-time) var(--col-ico) 1fr;
  column-gap:var(--col-gap);align-items:center;
  padding:.15rem var(--row-pad);border-bottom:1px dashed var(--line-soft);
  font-size:.72rem;line-height:22px;color:var(--ink-3);letter-spacing:.04em;
}
.sun .s-t{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
.sun .s-d{justify-self:center;width:.55rem;height:.55rem;border-radius:50%;
  background:var(--panel);border:2px solid var(--ink-3);position:relative;z-index:1;}
.sun.set .s-d{background:var(--ink-3);}
.sun.in-hike{background:var(--c-tint);}
.sun.in-hike::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--row-pad) + var(--col-time) + var(--col-gap) + var(--col-ico)/2 - 2px);width:4px;background:var(--c);opacity:.55;}
.tl.now::after{
  content:"今ここ";position:absolute;right:.6rem;top:.35rem;
  font-size:.62rem;font-weight:700;color:#fff;background:var(--c);
  padding:.1rem .45rem;border-radius:999px;letter-spacing:.04em;
}

/* ───────── ポイント欄 ───────── */
.note{padding:.75rem .75rem .85rem;background:var(--c-bg);border-top:1px dashed var(--line);}
.note-h{font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em;margin-bottom:.3rem;}
.note ul{list-style:none;}
.note li{font-size:.82rem;line-height:1.6;color:var(--ink-2);padding-left:.9rem;position:relative;}
.note li+li{margin-top:.3rem;}
.note li::before{content:"";position:absolute;left:.15rem;top:.62em;width:.32rem;height:.32rem;border-radius:50%;background:var(--c);}

.foot{text-align:center;font-size:.7rem;color:var(--ink-3);padding:.6rem 0 1rem;letter-spacing:.04em;}

/* ───────── レスポンシブ ───────── */
@media (max-width:400px){
  :root{--fs-base:18.5px;--col-time:3.3rem;--row-pad:.6rem;}
}
@media (prefers-reduced-motion:reduce){
  .tab-panel.is-active{animation:none;}
  *{transition:none !important;animation:none !important;}
}
@media print{
  .tabs{display:none;}
  .tab-panel{display:block !important;}
}

/* ───────── ダークモード（不要ならこのブロックごと削除） ───────── */
@media (prefers-color-scheme:dark){
  :root{
    --paper:     hsl(var(--h-base), 12%, 11%);
    --paper-2:   hsl(var(--h-base), 12%, 17%);
    --panel:     hsl(var(--h-base), 11%, 15%);
    --ink:       hsl(var(--h-base), 18%, 93%);
    --ink-2:     hsl(var(--h-base), 10%, 74%);
    --ink-3:     hsl(var(--h-base),  8%, 58%);
    --line:      hsl(var(--h-base), 10%, 27%);
    --line-soft: hsl(var(--h-base), 10%, 22%);
    --brand:     hsl(var(--h-brand),50%,66%);
    --brand-bg:  hsl(var(--h-brand),30%,20%);
    --alert:     hsl(14, 70%, 64%);
  }
  body{background-image:radial-gradient(hsla(var(--h-base),20%,70%,.07) 1.1px, transparent 1.1px);}
{{day_rules_dark}}  .pack{--c:hsl(var(--h-pack),55%,60%);--c-bg:hsl(var(--h-pack),26%,18%);}
  .tab-btn.active{color:hsl(var(--h-base),15%,10%);}
  .cover-frame img{filter:brightness(.86) saturate(.95);}
  .tl.now::after,.tag{color:hsl(var(--h-base),15%,10%);}
}
</style>
</head>
<body>

{{body}}<script>
(function(){
  "use strict";
  var NS = '{{ns}}';

  /* ── タブ切り替え ── */
  var btns   = [].slice.call(document.querySelectorAll('.tab-btn'));
  var panels = [].slice.call(document.querySelectorAll('.tab-panel'));
  var tabsEl = document.querySelector('.tabs');
  /* 選んだタブを横スクロールの中央へ */
  function centerTab(b, smooth){
    if (!tabsEl || !b) return;
    var left = b.offsetLeft - (tabsEl.clientWidth - b.offsetWidth) / 2;
    try{ tabsEl.scrollTo({ left: Math.max(0, left), behavior: smooth ? 'smooth' : 'auto' }); }
    catch(e){ tabsEl.scrollLeft = Math.max(0, left); }
  }
  function edgeFade(){
    if (!tabsEl) return;
    var max = tabsEl.scrollWidth - tabsEl.clientWidth;
    tabsEl.classList.toggle('fl', tabsEl.scrollLeft > 4);
    tabsEl.classList.toggle('fr', tabsEl.scrollLeft < max - 4);
  }
  if (tabsEl){
    tabsEl.addEventListener('scroll', edgeFade, { passive: true });
    window.addEventListener('resize', function(){ edgeFade(); centerTab(tabsEl.querySelector('.tab-btn.active'), false); });
  }
  function activate(id, remember){
    btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === id); });
    panels.forEach(function(p){ p.classList.toggle('is-active', p.id === id); });
    centerTab(btns.filter(function(b){ return b.getAttribute('data-tab') === id; })[0], remember);
    edgeFade();
    if (remember){ try{ localStorage.setItem(NS+'tab', id); }catch(e){} }
  }
  btns.forEach(function(b){
    b.addEventListener('click', function(){ activate(b.getAttribute('data-tab'), true); });
  });

  /* ── 出発までのカウントダウン ── */
  var DAYS = {{days_json}};
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  var el = document.getElementById('countdown');
  if (el){
    var idx = DAYS.indexOf(todayKey());
    if (idx >= 0){
      el.innerHTML = '旅の<b>' + (idx+1) + '</b>日目';
    } else {
      var diff = Math.ceil((new Date('{{start}}T00:00:00') - new Date()) / 86400000);
      el.innerHTML = diff > 0 ? '出発まで あと<b>' + diff + '</b>日' : '';
    }
  }

  /* ── 当日は「今ここ」を自動表示 ── */
  function toMin(r){ var p = r.getAttribute('data-t').split(':'); return (+p[0])*60 + (+p[1]); }
  function markNow(){
    [].slice.call(document.querySelectorAll('.tl.now')).forEach(function(r){ r.classList.remove('now'); });
    [].slice.call(document.querySelectorAll('.past')).forEach(function(r){ r.classList.remove('past'); });
    var key = todayKey(), i = DAYS.indexOf(key);
    if (i < 0) return null;            /* 旅行前・旅行後は何もしない（全て元の濃さ） */
    var now  = new Date(), mins = now.getHours()*60 + now.getMinutes();
    var cur  = null;
    [].slice.call(document.querySelectorAll('.card[data-date]')).forEach(function(card){
      var d = card.getAttribute('data-date');
      var rows = [].slice.call(card.querySelectorAll('[data-t]'));
      if (d < key){ rows.forEach(function(r){ r.classList.add('past'); }); return; }
      if (d > key) return;
      var tl = rows.filter(function(r){ return r.classList.contains('tl'); });
      tl.forEach(function(r){ if (toMin(r) <= mins) cur = r; });
      if (cur) cur.classList.add('now');
      var curMin = cur ? toMin(cur) : -1;
      rows.forEach(function(r){
        if (r === cur) return;
        if (r.classList.contains('tl') ? toMin(r) < curMin : toMin(r) <= mins) r.classList.add('past');
      });
    });
    return cur;
  }
  /* 「今ここ」までスクロール（タブの下に収まるように） */
  function scrollToNow(smooth){
    var cur = document.querySelector('.tl.now');
    if (!cur) return;
    var tabs = document.querySelector('.tabs');
    var y = cur.getBoundingClientRect().top + window.pageYOffset - (tabs ? tabs.offsetHeight : 0) - 70;
    window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ── 初期表示：旅行中はその日のタブ、それ以外は前回のタブ ── */
  var openTab = null;
  var di = DAYS.indexOf(todayKey());
  if (di >= 0){ openTab = 'day' + (di+1); }
  else { try{ openTab = localStorage.getItem(NS+'tab'); }catch(e){} }
  if (openTab && document.getElementById(openTab)) activate(openTab, false);

  markNow();
  if (di >= 0) requestAnimationFrame(function(){ scrollToNow(false); });
  /* 旅行中に当日のタブを押したら「今ここ」へ */
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      if (di >= 0 && b.getAttribute('data-tab') === 'day' + (di+1)) setTimeout(function(){ scrollToNow(true); }, 30);
    });
  });
  setInterval(markNow, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) markNow(); });
  centerTab(document.querySelector('.tab-btn.active'), false); edgeFade();
})();
</script>

</body>
</html>
