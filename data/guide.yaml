# 本棚のタブを選んだ時に出す、短い紹介文（2文くらい）

# 旅先：地方タブ
regions:
  北海道: 日本の面積の約2割を占める北の大地。大雪山の山歩きと、札幌・小樽・旭川・網走の街めぐり。
  東北: 奥羽山脈が南北に走る6県。磐梯山・安達太良山の火山と温泉の地方で、百名山はここから始まった。
  関東: 首都圏の1都6県。都心のテーマパークや博物館から、奥多摩・秩父・日光・筑波の山まで近場でそろう。
  中部: 新潟から愛知までの9県。北アルプス・八ヶ岳・富士山と、日本の高い山が集まる地方。
  近畿: 京都・奈良の古都と大阪の街。紀伊半島には大台ヶ原・大峰山脈の深い山がある。
  中国: 瀬戸内の穏やかな海と中国山地。福山・尾道・倉敷の港町と城下町。
  四国: 4県を四国山地が分ける島。西日本最高峰の石鎚山と剣山、こんぴらさんと道後温泉。
  九州・沖縄: 火山の九州と南の島々。くじゅう・阿蘇・霧島の山と温泉、沖縄の海。
  海外: アメリカ西海岸・シンガポール・香港・ハワイ。次は台湾で東アジア最高峰の玉山へ。

# 宿泊：系列の札（2軒以上ある系列）
groups:
  ドーミーイン: 天然温泉の大浴場と、夜鳴きそば（無料の夜食ラーメン）が名物のホテル。和風の「御宿 野乃」も同じ共立リゾートの系列。
  カンデオ: 上層階の展望露天風呂「スカイスパ」が特徴の、駅に近いホテル。
  スーパーホテル: 天然温泉と無料の健康朝食。チェックイン機で手続きする、全国チェーンのビジネスホテル。
  マイステイズ: 「ホテルマイステイズ」を中心に、全国の都市にあるホテルチェーン。
  マリオット: 世界最大級のホテルグループ。ルネッサンス、リッツ・カールトンなど多くのブランドを持つ。
  リッチモンド: 駅前に多いビジネスホテル。広めの客室と、ボリュームのある朝食が人気。
  グレイスリー: 藤田観光のホテル。ワシントンホテルと同じ会社で、台北にもある。
  ダイワロイネット: 大和ハウスグループの都市型ホテル。広めの客室で、家族でも泊まりやすい。
  ベッセル: 広島県福山市生まれのベッセルホテルズ。「ベッセルイン」「レフ」などのブランドがある。
  三井ガーデン: 三井不動産グループの都市型ホテル。デザインに凝った館内で、大浴場のある所も多い。

# 山：山系のタブ（peaks は山の名前。ここにない山は「その他」）
ranges:
- name: 北海道・東北
  intro: 大雪山（旭岳）は北海道の最高峰。東北は磐梯山・安達太良山の火山で、百名山の1・2座目。
  peaks: [大雪山, 磐梯山, 安達太良山]
- name: 関東
  intro: 日帰りで歩ける関東の山。日光白根山は関東より北で一番高い山で、高尾山・宝登山・筑波山は家族向けの低山。
  peaks: [高尾山, 宝登山, 日光白根山, 筑波山, 丹沢山, 赤城山]
- name: 富士山
  intro: 日本一の3,776m。吉田ルートで七合目の山小屋に泊まり、2回登った。
  peaks: [富士山]
- name: 奥秩父・八ヶ岳
  intro: 東京・山梨・長野にまたがる山域。雲取山は東京都の最高峰、瑞牆山・金峰山は奥秩父の岩峰、硫黄岳は八ヶ岳、霧ヶ峰・美ヶ原はその北の高原。
  peaks: [雲取山, 瑞牆山, 金峰山, 硫黄岳, 霧ヶ峰, 美ヶ原]
- name: 北アルプス
  intro: 飛騨山脈。3,000m近い稜線を歩き、山頂近くの山小屋に泊まる。
  peaks: [唐松岳, 燕岳, 白馬岳]
- name: 近畿・北陸
  intro: 滋賀の最高峰の伊吹山、近畿の最高峰の八経ヶ岳と大台ヶ原（紀伊半島）、福井の荒島岳。
  peaks: [伊吹山, 大台ヶ原, 八経ヶ岳, 荒島岳]
- name: 四国
  intro: 西日本最高峰の石鎚山（1,982m）と、四国で2番目に高い剣山（1,955m）。
  peaks: [剣山, 石鎚山]
- name: 九州
  intro: 火山の山が多い。くじゅう連山・阿蘇・霧島の韓国岳と、「薩摩富士」の開聞岳。
  peaks: [九重山, 阿蘇山, 韓国岳, 開聞岳]
- name: 海外
  intro: 台湾の玉山（3,952m）は東アジアの最高峰。排雲山荘に泊まって登る。
  peaks: [玉山主峰]

