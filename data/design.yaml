# 制作タブに出す決まりごと（CLAUDE.md と同じ内容を短く）
cats:
- id: museum
  name: 博物館・科学館
- id: aqua
  name: 水族館・動物園
- id: park
  name: テーマパーク
- id: shop
  name: 商業施設
design:
- name: 基本
  items:
  - 1つのHTMLファイルで完結。表紙画像は埋め込み、外から読み込むのはフォントだけ
  - GitHub Pagesに「YYMMDD地名」のリポジトリを作り、index.html で置く
  - 見るのは本棚（このアプリ）から。電波がなくても開けるよう本棚が保存する
  - 方針は「パッと見てわかる」。毎回同じ型を使い回さず、少しずつ磨く
- name: 表紙
  items:
  - 息子の写真をもとに、旅先の景色と組み合わせた色鉛筆調のイラスト（Gemini）
  - タイトルは1行で「N泊N日〇〇旅行」。日付は「2026.11.20(金) — 11.23(月)」
  - 出発までのカウントダウン。旅行当日は表紙を小さな帯にして旅程を先に見せる
  - フッター・人数表記・凡例は載せない
  - イラストがまだない冊は、本棚では仮の表紙（年・行き先の縦書き・日ごとの色の帯）
- name: 本棚
  items:
  - 「これから」「これまで」の表紙の棚だけ。次の旅は「これから」の先頭（あと何日の札つき）
  - タブは6つを画面内に並べる（横スクロールにしない）。保存の状況などのフッターは出さない
  - 「これまで」は出発した年ごとに区切り、上の年ボタンでその年へ飛ぶ
  - 表紙の下は出発日だけ（泊数はタイトルにあるので書かない）。オフライン保存は黙って行う
  - 旅先は地方のタブ→都道府県（北から）→市区町村（県庁所在地、あとは人口順）。初訪問の年月は出さない
  - 県庁所在地はバッジ、読みにくい地名はふりがな
  - 宿・山の表は、しおりの列で旅とつなぐ。宿の料金は1泊あたり
  - 宿の名前は短くして1行に。系列（ドーミーイン・スーパーホテルなど）の札で絞り込める
- name: 色と文字
  items:
  - 表紙から色相を抜き出し、紙・主色・準備・各日に割り当てる（CSS冒頭の数字だけで全体が変わる）
  - 見出しは Zen Maru Gothic、本文は Noto Sans JP。文字は大きめ（基準20px、狭い画面は18.5px）
  - ダークモードに対応。暗い時は表紙を少し暗くする
  - 要予約・強調は日の色のハイライト、要注意は朱色
- name: タブ
  items:
  - 「準備」＋各日。表記は「11/21 土」＋行き先
  - 1行の横スクロール。選んだタブを中央へ、端に続きがある時はうっすら消す
  - 旅行中は今日のタブを開き、「今ここ」の行へ自動でスクロール
- name: タイムライン
  items:
  - 2段構成：上段＝開始時刻・アイコン・概要、下段＝所要時間・詳細。行は表のように揃える
  - 概要は全角14文字以内（iPhone幅で1行）。移動は「手段→到着地」（例：特急→霧島神宮）
  - 5分未満の所要時間は空欄。就寝の行は起床までの睡眠時間
  - 日の出・日の入の区切り行を入れる
  - 旅行中は過ぎた行を薄くする（旅行後は元に戻る）
  - 地名を押すとGoogleマップ
  - 宿・予約・注意点は手配カードを作らず、タイムラインの該当行に書く
- name: 山
  items:
  - 山データは「標高・コースタイム・コース定数」の3つ。項目名は付けず、数値＋補足の2行
  - 標高の下に百名山の通算座数（白馬岳12座目〜）
  - 数値はYAMAPの計画・実測。登山区間は日の色で太く強調
  - 地点は名前のある所だけ（「分岐」は省く）。アイコンは登り・山頂・下りの3種
- name: 準備タブ
  items:
  - 持ち物はカテゴリ別のチェックリスト。1行で、補足は付けない（全角17文字以内）
  - チェックは端末に保存。「済みを隠す」で終わった物をたたむ
  - 費用は交通費・宿泊費の表（日付／項目／金額）。金額が分かっている分だけ合計
- name: 載せないもの
  items: [予約番号・電話番号, メモ欄・凡例・フッター, 絵文字（アイコンは塗りつぶしのSVGで統一）]
- name: 確認
  items: [iPhone幅（390px）で表示して、折り返しやはみ出しがないか確かめる]
